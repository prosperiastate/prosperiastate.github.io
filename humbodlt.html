<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>COG Viewer</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
  <style>
    html, body, #map { margin: 0; height: 100%; width: 100%; }
    #info { position: absolute; top: 10px; left: 50px; z-index: 1; background: #fff;
            padding: 6px 10px; border-radius: 4px; font: 13px sans-serif; box-shadow: 0 1px 4px #0004; }
  </style>
</head>
<body>
  <div id="info">Loading COG…</div>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/proj4@2.12.1/dist/proj4.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/geotiff@3.0.5/dist-browser/geotiff.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js"></script>
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('info').innerHTML =
        'Open this page via <b>http://localhost:8000</b> (run <code>python -m http.server 8000</code> in this folder). ' +
        'S3 CORS blocks pages opened from file://.';
    }

    const COG_URL ='https://drone-cogs-sourav.s3.us-east-2.amazonaws.com/cogs/Humboldt_15ft_Sourav_10152024_cog.tif';

    // The COG is in NAD83(2011) / UTM 15N — register it so OpenLayers can reproject.
    proj4.defs('EPSG:6344', '+proj=utm +zone=15 +ellps=GRS80 +towgs84=0,0,0,0,0,0,0 +units=m +no_defs');
    ol.proj.proj4.register(proj4);

    // Streams only the tiles/overviews needed for the current view via HTTP range requests.
    const cog = new ol.source.GeoTIFF({ sources: [{ url: COG_URL }] });

    const map = new ol.Map({
      target: 'map',
      layers: [
        new ol.layer.Tile({
          source: new ol.source.XYZ({
            url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
            attributions: 'Tiles © Esri',
            maxZoom: 19,
          }),
        }),
        new ol.layer.WebGLTile({ source: cog }),
      ],
      view: new ol.View({ center: [0, 0], zoom: 2 }),
    });

    cog.getView().then(v => {
      const extent = ol.proj.transformExtent(v.extent, v.projection, map.getView().getProjection());
      map.getView().fit(extent, { padding: [20, 20, 20, 20] });
      document.getElementById('info').textContent = COG_URL.split('/').pop();
    }).catch(err => {
      if (location.protocol === 'file:') return; // keep the file:// hint
      document.getElementById('info').textContent = 'Failed to load COG: ' + err.message;
      console.error(err);
    });
  </script>
</body>
</html>
