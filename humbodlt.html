<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Humboldt Drone Imagery</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css">
  <style>
    *{box-sizing:border-box}body{margin:0;background:#edf1f4;color:#182c3b;font:15px/1.5 system-ui,sans-serif}
    header{padding:18px 24px;background:#142d3d;color:white;display:flex;align-items:center;justify-content:space-between;gap:16px}
    h1{font-size:21px;margin:0}header p{font-size:13px;color:#b8ccd8;margin:3px 0 0}.badge{font-size:12px;background:#284959;padding:5px 10px;border-radius:20px;white-space:nowrap}
    .toolbar{padding:12px 24px;background:white;display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-bottom:1px solid #d9e1e7}
    button{font:inherit;background:#1b6171;color:white;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}button:disabled{opacity:.45;cursor:default}
    label{display:flex;align-items:center;gap:8px}input{width:110px;accent-color:#1b6171}
    #status{flex:1;min-width:200px;font-size:13px;color:#405b6b}#status[data-error="true"]{color:#a62222}
    #map{height:calc(100dvh - 176px);min-height:350px;background:#dbe2e6;background-image:linear-gradient(45deg,#cfd8de 25%,transparent 25%),linear-gradient(-45deg,#cfd8de 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cfd8de 75%),linear-gradient(-45deg,transparent 75%,#cfd8de 75%);background-size:32px 32px;background-position:0 0,0 16px,16px -16px,-16px 0}
    footer{padding:9px 24px;font-size:12px;color:#536978;background:white}a{color:#1b6171}#error{padding:14px 24px;background:#fff1ed;color:#842c20;border-bottom:1px solid #f0ccc1}#error[hidden]{display:none}
    @media(max-width:600px){header,.toolbar,footer{padding-left:14px;padding-right:14px}.badge{display:none}#map{height:65dvh}h1{font-size:19px}}
  </style>
</head>
<body>
  <header><div><h1>Humboldt Drone Imagery</h1><p>Orthomosaic · October 15, 2024</p></div><span class="badge">S3 · Cloud Optimized GeoTIFF</span></header>
  <div class="toolbar">
    <button id="fit" disabled>Fit imagery</button>
    <label>Opacity <input id="opacity" type="range" min="0" max="100" value="100"><output id="opacityValue">100%</output></label>
    <button id="retry">Reload</button>
    <span id="status" role="status" aria-live="polite">Loading viewer libraries…</span>
  </div>
  <div id="error" role="alert" hidden></div>
  <main id="map" aria-label="Interactive Humboldt orthomosaic map"></main>
  <footer>Scroll to zoom · Drag to pan · Native NAD83(2011) / UTM 15N · <a id="download">Download original COG (3.1 GB)</a></footer>
  <script>
    const TIFF_URL = 'https://drone-cogs-sourav.s3.us-east-2.amazonaws.com/cogs/Humboldt_15ft_Sourav_10152024_cog.tif';
    const statusNode = document.getElementById('status');
    const errorNode = document.getElementById('error');
    const fitButton = document.getElementById('fit');
    let map, layer, imageExtent, tileFailed = false;
    function status(message, failed = false) {
      statusNode.textContent = message;
      statusNode.dataset.error = String(failed);
    }
    function fail(message) {
      status('Unable to display imagery', true);
      errorNode.textContent = message;
      errorNode.hidden = false;
    }
    window.addEventListener('error', event => {
      if (event.message) fail(event.message);
    });
    window.addEventListener('unhandledrejection', event => {
      fail(event.reason?.message || String(event.reason));
    });
    function loadScript(url) {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        script.src = url;
        script.onload = resolve;
        script.onerror = () => reject(new Error('Could not load viewer library. Check your internet connection or content blocker, then click Reload.'));
        document.head.appendChild(script);
      });
    }
    document.getElementById('download').href = TIFF_URL;
    document.getElementById('retry').onclick = () => location.reload();
    document.getElementById('opacity').oninput = event => {
      document.getElementById('opacityValue').textContent = event.target.value + '%';
      if (layer) layer.setOpacity(Number(event.target.value) / 100);
    };
    fitButton.onclick = () => {
      if (map && imageExtent) map.getView().fit(imageExtent, {padding:[30,30,30,30],duration:250});
    };
    async function start() {
      try {
        // The full OpenLayers build requires the GeoTIFF global separately.
        await loadScript('https://cdn.jsdelivr.net/npm/geotiff@2.1.3/dist-browser/geotiff.js');
        await loadScript('https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js');
        status('Checking access to S3 imagery…');
        let response;
        try {
          response = await fetch(TIFF_URL, {
            headers: {Range:'bytes=0-1023'},
            signal: AbortSignal.timeout(20000)
          });
        } catch (error) {
          throw new Error('Cannot reach the TIFF. Check S3 public read permission and CORS for this website origin (' + location.origin + '). If those are configured, check your network. ' + error.message);
        }
        if (response.status !== 206) {
          if (response.body) await response.body.cancel();
          throw new Error('S3 returned HTTP ' + response.status + '. Expected 206 Partial Content. For 403, configure public read access to this object; CORS alone does not grant access.');
        }
        await response.arrayBuffer();
        status('Reading TIFF metadata…');
        // This viewer stays in the imagery’s native CRS; no basemap or reprojection is needed.
        ol.proj.addProjection(new ol.proj.Projection({code:'EPSG:6344',units:'m'}));
        const source = new ol.source.GeoTIFF({
          sources:[{url:TIFF_URL}],
          projection:'EPSG:6344',
          normalize:true,
          sourceOptions:{allowFullFile:false}
        });
        layer = new ol.layer.WebGLTile({source});
        source.on('tileloadstart', () => { if (!tileFailed) status('Loading image tiles…'); });
        source.on('tileloadend', () => { if (!tileFailed) status('Ready · image tiles streamed from S3'); });
        source.on('tileloaderror', () => {
          tileFailed = true;
          fail('An image tile could not load. Check the browser Console and Network tabs, then click Reload.');
        });
        const options = await source.getView();
        imageExtent = options.extent;
        map = new ol.Map({target:'map',layers:[layer],view:new ol.View(options)});
        map.addControl(new ol.control.ScaleLine());
        fitButton.disabled = false;
        if (imageExtent) map.getView().fit(imageExtent,{padding:[30,30,30,30]});
        status('Loading image tiles…');
      } catch (error) {
        console.error(error);
        fail(error.message || String(error));
      }
    }
    start();
  </script>
</body>
</html>
