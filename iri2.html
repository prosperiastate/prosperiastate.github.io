<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Iowa IRI Map</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --border: #dde0e8;
    --text: #1a1d27; --muted: #7a7f9a;
    --accent: #1a6ef5; --accent2: #7c3aed; --clinton: #e67e00; --sb: #0d9488; --lee: #16a34a;
    --radius: 12px; --panel-h: 36px; --topbar-h: 36px;
  }
  html, body { height: 100%; font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; }
  #map { position: absolute; inset: 0; top: var(--topbar-h); bottom: var(--panel-h); }

  /* TOP BAR */
  #topbar {
    position: absolute; top: 0; left: 0; right: 0; height: var(--topbar-h);
    z-index: 900; background: rgba(255,255,255,0.97); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border); padding: 0 6px;
    display: flex; align-items: center; gap: 4px; overflow-x: auto; scrollbar-width: none;
  }
  #topbar::-webkit-scrollbar { display: none; }
  #topbar h1 {
    font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.03em; color: var(--accent); flex: 1;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #modeToggle, #sourceToggle {
    display: flex; align-items: center; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 999px; padding: 2px; gap: 1px; flex-shrink: 0;
  }
  .mode-btn {
    padding: 2px 8px; border-radius: 999px; border: none; background: transparent;
    color: var(--muted); font-family: 'DM Sans', sans-serif; font-size: 10px; font-weight: 600;
    cursor: pointer; transition: all 0.18s; white-space: nowrap;
    -webkit-tap-highlight-color: transparent; letter-spacing: 0.02em;
  }
  .mode-btn.active          { background: var(--accent);  color: #fff; box-shadow: 0 1px 4px rgba(26,110,245,0.3); }
  .mode-btn.active.seg-pill { background: var(--accent2); box-shadow: 0 1px 4px rgba(124,58,237,0.3); }
  .mode-btn.active.sb-pill  { background: var(--sb);      box-shadow: 0 1px 4px rgba(13,148,136,0.3); }
  .mode-btn:active { transform: scale(0.95); }

  #gpsBtn {
    display: flex; align-items: center; gap: 4px; background: var(--bg);
    border: 1.5px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 999px;
    cursor: pointer; transition: all 0.2s; white-space: nowrap;
    -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  #gpsBtn:active { transform: scale(0.96); }
  #gpsBtn.active    { background: var(--accent); border-color: var(--accent); color: #fff; }
  #gpsBtn.searching { border-color: #f9a825; color: #f9a825; }
  #gpsBtn svg { width: 12px; height: 12px; flex-shrink: 0; }

  /* ZOOM */
  .leaflet-top.leaflet-left { top: 10px !important; }
  .leaflet-control-zoom { border: 1px solid var(--border) !important; background: #fff !important; box-shadow: 0 2px 8px rgba(0,0,0,0.10) !important; }
  .leaflet-control-zoom a { background: #fff !important; color: var(--text) !important; border-color: var(--border) !important; font-size: 18px !important; width: 36px !important; height: 36px !important; line-height: 36px !important; }
  .leaflet-bar { border-color: var(--border) !important; }

  /* BOTTOM PANEL */
  #panel {
    position: absolute; bottom: 0; left: 0; right: 0; height: var(--panel-h);
    background: var(--panel); border-top: 1px solid var(--border);
    z-index: 900; display: flex; align-items: center;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.06);
  }

  /* LAYER TAB BUTTONS */
  #layerTabs {
    display: flex; align-items: center; background: var(--bg);
    border: 1.5px solid var(--border); border-radius: 999px; padding: 2px; gap: 1px; flex-shrink: 0;
  }
  .tab-btn {
    padding: 2px 8px; border-radius: 999px; border: none; background: transparent;
    color: var(--muted); font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.18s;
    -webkit-tap-highlight-color: transparent; text-align: center; line-height: 1.2; white-space: nowrap;
  }
  .tab-btn:active { transform: scale(0.95); }
  .tab-btn.clinton-on { background: var(--clinton); color: #fff; box-shadow: 0 1px 4px rgba(230,126,0,0.3); }
  .tab-btn.lee-on     { background: var(--lee);     color: #fff; box-shadow: 0 1px 4px rgba(22,163,74,0.3); }

  /* DATE RANGE BUTTON */
  #dateRangeBtn {
    display: flex; align-items: center; gap: 4px; background: var(--bg);
    border: 1.5px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 999px;
    cursor: pointer; transition: all 0.18s; white-space: nowrap;
    -webkit-tap-highlight-color: transparent; flex-shrink: 0; letter-spacing: 0.02em;
    position: relative;
  }
  #dateRangeBtn.active { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 1px 4px rgba(26,110,245,0.3); }
  #dateRangeBtn:active { transform: scale(0.95); }
  #dateRangeDot {
    width: 6px; height: 6px; border-radius: 50%; background: #f9a825;
    display: none; flex-shrink: 0;
  }
  #dateRangeBtn.filtered #dateRangeDot { display: inline-block; }
  #drawPolyBtn {
  display: flex; align-items: center; gap: 4px; background: var(--bg);
  border: 1.5px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif;
  font-size: 10px; font-weight: 500; padding: 2px 8px; border-radius: 999px;
  cursor: pointer; transition: all 0.2s; white-space: nowrap; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
  }
  #drawPolyBtn:active { transform: scale(0.96); }
  #drawPolyBtn.active { background: var(--accent2); border-color: var(--accent2); color: #fff; }
  
  /* DATE RANGE DROPDOWN */
  #dateDropdown {
    position: absolute; top: calc(var(--topbar-h) + 6px); left: 50%; transform: translateX(-50%);
    z-index: 1000; background: #fff; border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: 0 4px 24px rgba(0,0,0,0.13);
    padding: 12px 14px; display: none; min-width: 260px; max-width: 320px;
    font-size: 12px;
  }
  #dateDropdown.open { display: block; }

  .dd-section-label {
    font-size: 10px; font-weight: 600; color: var(--muted); letter-spacing: 0.06em;
    text-transform: uppercase; margin-bottom: 6px;
  }
  .preset-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin-bottom: 12px;
  }
  .preset-btn {
    padding: 4px 6px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif;
    font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.15s;
    text-align: center; -webkit-tap-highlight-color: transparent;
  }
  .preset-btn:hover  { border-color: var(--accent); color: var(--accent); }
  .preset-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .preset-btn:active { transform: scale(0.96); }

  .dd-divider { border: none; border-top: 1px solid var(--border); margin: 10px 0; }

  .date-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
  .date-row label { font-size: 11px; font-weight: 600; color: var(--muted); width: 28px; flex-shrink: 0; }
  .date-row input[type="month"] {
    flex: 1; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px;
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text); background: var(--bg);
    outline: none; cursor: pointer;
  }
  .date-row input[type="month"]:focus { border-color: var(--accent); }

  #applyDateRange {
    width: 100%; padding: 6px; border-radius: 8px; border: none;
    background: var(--accent); color: #fff; font-family: 'DM Sans', sans-serif;
    font-size: 11px; font-weight: 600; cursor: pointer; transition: all 0.15s; margin-top: 4px;
  }
  #applyDateRange:hover  { background: #1559cc; }
  #applyDateRange:active { transform: scale(0.98); }

  #countBadge {
    font-size: 10px; color: var(--muted); text-align: center;
    margin-top: 6px; font-family: 'DM Mono', monospace;
  }

  /* LEGEND + SCALEBAR */
  #legendScroll {
    flex: 1; overflow-x: auto; overflow-y: hidden; display: flex; align-items: center;
    gap: 4px; padding: 0 8px; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    height: 100%;
  }
  #legendScroll::-webkit-scrollbar { display: none; }
  .legend-chip {
    display: flex; align-items: center; gap: 5px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 999px; padding: 2px 8px 2px 6px;
    white-space: nowrap; font-size: 10px; color: var(--text); flex-shrink: 0;
  }
  .legend-dot  { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .legend-line { width: 16px; height: 3px; border-radius: 2px; flex-shrink: 0; }

  #footerCourtesy {
    flex-shrink: 0; padding: 0 8px 0 4px;
    font-size: 10px; color: var(--muted); white-space: nowrap;
    border-left: 1px solid var(--border); margin-left: 2px;
  }
  #footerCourtesy a { color: var(--accent); text-decoration: none; font-size: 10px; }
  #footerCourtesy a:hover { text-decoration: underline; }

  .leaflet-control-attribution, #authorAttrib { display: none !important; }

  /* LEAFLET POPUP */
  .leaflet-popup-content-wrapper {
    border-radius: var(--radius) !important;
    border: 1px solid var(--border) !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.13) !important;
    padding: 0 !important;
    font-family: 'DM Sans', sans-serif !important;
    min-width: 200px; max-width: 280px;
  }
  .leaflet-popup-content {
    margin: 0 !important; padding: 13px 15px !important;
    font-size: 13px; color: var(--text);
  }
  .leaflet-popup-tip-container { margin-top: -1px; }
  .leaflet-popup-tip { background: #fff !important; box-shadow: none !important; }
  .leaflet-popup-close-button {
    top: 8px !important; right: 10px !important;
    color: var(--muted) !important; font-size: 18px !important;
    width: 20px !important; height: 20px !important; line-height: 20px !important;
  }
  .popup-mode { display: inline-block; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; padding: 2px 7px; border-radius: 999px; margin-bottom: 6px; text-transform: uppercase; }
  .popup-mode.whole { background: rgba(26,110,245,0.1); color: var(--accent); }
  .popup-mode.seg   { background: rgba(124,58,237,0.1); color: var(--accent2); }
  .popup-title { font-weight: 600; font-size: 13px; margin-bottom: 7px; padding-right: 16px; line-height: 1.3; }
  .popup-grid  { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
  .info-key  { color: var(--muted); font-size: 12px; }
  .info-val  { color: var(--text); font-family: 'DM Mono', monospace; font-size: 12px; }
  .iri-badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 11px; font-weight: 600; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.3); }

  /* GPS */
  .gps-dot { width:18px; height:18px; background:var(--accent); border:3px solid #fff; border-radius:50%; box-shadow:0 0 0 6px rgba(26,110,245,0.2); animation:pulse 2s infinite; }
  @keyframes pulse { 0%,100%{box-shadow:0 0 0 4px rgba(26,110,245,0.25);}50%{box-shadow:0 0 0 10px rgba(26,110,245,0.06);} }
  .leaflet-gps-accuracy { pointer-events: none; }
  #gpsStatus { position:absolute; top:calc(var(--topbar-h)+8px); left:50%; transform:translateX(-50%); z-index:960; background:#fff; border:1px solid var(--border); border-radius:999px; padding:5px 14px; font-size:12px; color:var(--muted); white-space:nowrap; display:none; pointer-events:none; box-shadow:0 2px 8px rgba(0,0,0,0.10); }
  #gpsStatus.visible { display: block; }

  #loadingToast { position:absolute; top:calc(var(--topbar-h)+8px); right:10px; z-index:960; background:#fff; border:1px solid var(--border); border-radius:999px; padding:5px 12px; font-size:11px; color:var(--muted); display:none; box-shadow:0 2px 8px rgba(0,0,0,0.10); align-items:center; gap:6px; }
  #loadingToast.visible { display: flex; }
  .spinner { width:12px; height:12px; border:2px solid var(--border); border-top-color:var(--accent); border-radius:50%; animation:spin 0.7s linear infinite; flex-shrink:0; }
  .spinner.seg { border-top-color: var(--accent2); }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="topbar">
  <h1>📍 Iowa IRI Map</h1>
  <div id="modeToggle">
    <button class="mode-btn active"   id="modeWhole" onclick="setMode('whole')">Whole</button>
    <button class="mode-btn seg-pill" id="modeSeg"   onclick="setMode('segment')">Segment</button>
  </div>
  <div id="sourceToggle">
    <button class="mode-btn active"   id="srcCyroid"   onclick="setSource('cyroid')">CyRoads</button>
    <button class="mode-btn sb-pill"  id="srcSmartBox" onclick="setSource('smartbox')">SmartBox</button>
  </div>
  <div id="layerTabs">
    <button class="tab-btn clinton-on" id="tab-clinton" onclick="toggleClinton()">Clinton Co</button>
    <button class="tab-btn"            id="tab-lee"     onclick="toggleLee()">Lee Co</button>
  </div>

  <button id="drawPolyBtn" onclick="togglePolyDraw()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:12px; height:12px; flex-shrink:0;">
    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
  </svg> Filter Area
</button>

  <!-- DATE RANGE FILTER -->
  <button id="dateRangeBtn" onclick="toggleDateDropdown()">
    <div id="dateRangeDot"></div>
    <span id="dateRangeBtnLabel">IRI All</span>
    ▾
  </button>

  <button id="gpsBtn" onclick="toggleGPS()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
      <circle cx="12" cy="12" r="8" stroke-dasharray="4 2"/>
    </svg>
    GPS
  </button>
</div>

<!-- DATE RANGE DROPDOWN -->
<div id="dateDropdown">
  <div class="dd-section-label">Quick select</div>
  <div class="preset-grid">
    <button class="preset-btn active" id="preset-all"  onclick="applyPreset('all')">All dates</button>
    <button class="preset-btn"        id="preset-2026" onclick="applyPreset('2026')">2026</button>
    <button class="preset-btn"        id="preset-2025" onclick="applyPreset('2025')">2025</button>
    <button class="preset-btn"        id="preset-2024" onclick="applyPreset('2024')">2024</button>
    <button class="preset-btn"        id="preset-1mo"  onclick="applyPreset('1mo')">Last 1 mo</button>
    <button class="preset-btn"        id="preset-1w"  onclick="applyPreset('1w')">Last 1 w</button>
  </div>
  <hr class="dd-divider">
  <div class="dd-section-label">Custom range</div>
  <div class="date-row">
    <label>From</label>
    <input type="month" id="fromMonth" placeholder="YYYY-MM">
  </div>
  <div class="date-row">
    <label>To</label>
    <input type="month" id="toMonth" placeholder="YYYY-MM">
  </div>
  <button id="applyDateRange" onclick="applyCustomRange()">Apply range</button>
  <div id="countBadge"></div>
</div>

<div id="map"></div>
<div id="gpsStatus"></div>
<div id="loadingToast"><div class="spinner" id="spinnerEl"></div><span id="loadingMsg">Loading…</span></div>

<div id="panel">
  <div id="legendScroll">
    <div class="legend-chip"><div class="legend-dot" style="background:#2E7D32"></div><span id="leg-excellent">Excellent</span></div>
    <div class="legend-chip"><div class="legend-dot" style="background:#8BC34A"></div><span id="leg-good">Good</span></div>
    <div class="legend-chip"><div class="legend-dot" style="background:#FFFF00"></div><span id="leg-fair">Fair</span></div>
    <div class="legend-chip"><div class="legend-dot" style="background:#FF9800"></div><span id="leg-acceptable">Acceptable</span></div>
    <div class="legend-chip"><div class="legend-dot" style="background:#D32F2F"></div><span id="leg-bad">Bad</span></div>
    <div class="legend-chip"><div class="legend-line" style="background:#FF00FF"></div>Primary</div>
    <div class="legend-chip"><div class="legend-line" style="background:#00FFFF"></div>Secondary</div>
    <div class="legend-chip" id="scalebarChip" style="margin-left:4px; gap:5px;">
      <span style="color:var(--muted);font-size:10px;font-weight:600;">Scale</span>
      <div id="scaleBar" style="height:5px;border:2px solid var(--text);border-top:none;display:inline-block;min-width:28px;"></div>
      <span id="scaleText" style="font-family:'DM Mono',monospace;font-size:10px;font-weight:500;">—</span>
    </div>
  </div>
  <div id="footerCourtesy">
    © <a href="https://www.openstreetmap.org/copyright" target="_blank">OSM</a>
     <a href="mailto:sourav@iastate.edu">sourav@iastate.edu</a>
  </div>
</div>

<script>
// ─────────────────────────────────────────────
//  CONFIG
// ─────────────────────────────────────────────
var URLS_CYROID = {
  whole:   'https://pub-256928d690cc446c84032baa7343824c.r2.dev/website/iri_whole.geojson',
  segment: 'https://pub-256928d690cc446c84032baa7343824c.r2.dev/website/iri_segments.geojson',
  clinton: 'https://pub-256928d690cc446c84032baa7343824c.r2.dev/website/Clinton_05212026.geojson'
};
var URLS_SMARTBOX = {
  whole:   'https://pub-256928d690cc446c84032baa7343824c.r2.dev/website/sb_iri_whole.geojson',
  segment: 'https://pub-256928d690cc446c84032baa7343824c.r2.dev/website/sb_iri_segments.geojson',
  clinton: null
};
var currentSource = 'cyroid';
var URLS = URLS_CYROID;

// ─────────────────────────────────────────────
//  DATE RANGE STATE
//  dateFrom / dateTo: null = no bound; or Date objects (start of month)
// ─────────────────────────────────────────────
var dateFrom = null;
var dateTo   = null;
var activePreset = 'all';

function parseCollectDate(val) {
  if (!val) return null;
  var d = new Date(val);
  return isNaN(d) ? null : d;
}

function featureInDateRange(f) {
  if (!dateFrom && !dateTo) return true;
  var d = parseCollectDate(f.properties.collect_dt);
  if (!d) return false;
  if (dateFrom && d < dateFrom) return false;
  if (dateTo   && d > dateTo)   return false;
  return true;
}

// ─────────────────────────────────────────────
//  IRI THRESHOLDS
// ─────────────────────────────────────────────
var IRI_THRESHOLDS = {
  highway:     [65,  85,  105, 125],
  county_road: [85,  105, 125, 145],
  city_street: [105, 125, 145, 170],
  default:     [85,  105, 125, 145]
};
var LEGEND_LABELS = {
  highway:     ['<65 in/mi','65–85 in/mi','85–105 in/mi','105–125 in/mi','>125 in/mi'],
  county_road: ['<85 in/mi','85–105 in/mi','105–125 in/mi','125–145 in/mi','>145 in/mi'],
  city_street: ['<105 in/mi','105–125 in/mi','125–145 in/mi','145–170 in/mi','>170 in/mi'],
  default:     ['<85 in/mi','85–105 in/mi','105–125 in/mi','125–145 in/mi','>145 in/mi']
};

function getRoadTypeKey(roadType) {
  if (!roadType) return 'default';
  var t = roadType.toLowerCase().replace(/ /g,'_');
  if (t.indexOf('highway') >= 0) return 'highway';
  if (t.indexOf('county')  >= 0) return 'county_road';
  if (t.indexOf('city')    >= 0 || t.indexOf('street') >= 0) return 'city_street';
  return 'default';
}

function classifyIRI(iriInMi, roadType) {
  var t = IRI_THRESHOLDS[getRoadTypeKey(roadType)];
  if (iriInMi < t[0]) return 'Excellent';
  if (iriInMi < t[1]) return 'Good';
  if (iriInMi < t[2]) return 'Fair';
  if (iriInMi < t[3]) return 'Acceptable';
  return 'Bad';
}

// ─────────────────────────────────────────────
//  LEGEND
// ─────────────────────────────────────────────
var currentLegendType = null;
var LEGEND_NAMES = ['Excellent','Good','Fair','Acceptable','Bad'];
var LEGEND_IDS   = ['excellent','good','fair','acceptable','bad'];

function updateLegend(roadType) {
  var key = getRoadTypeKey(roadType);
  if (key === currentLegendType) return;
  currentLegendType = key;
  var labels = LEGEND_LABELS[key];
  LEGEND_IDS.forEach(function(id, i) {
    document.getElementById('leg-'+id).textContent =
      roadType ? LEGEND_NAMES[i]+' '+labels[i] : LEGEND_NAMES[i];
  });
}

function resetLegend() {
  currentLegendType = null;
  LEGEND_IDS.forEach(function(id, i) {
    document.getElementById('leg-'+id).textContent = LEGEND_NAMES[i];
  });
}

// ─────────────────────────────────────────────
//  MAP INIT
// ─────────────────────────────────────────────
var map = L.map('map', { center:[42.05,-93.5], zoom:8, zoomControl:true, tap:true, tapTolerance:20 });
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);

var isMobile = window.matchMedia('(max-width:768px)').matches;

// ─────────────────────────────────────────────
//  CUSTOM SCALEBAR
// ─────────────────────────────────────────────
function updateScalebar() {
  var center = map.getCenter();
  var containerW = map.getContainer().clientWidth;
  var targetPx = Math.round(containerW * 0.12);
  targetPx = Math.max(40, Math.min(targetPx, 120));
  var metersPerPx = (156543.03392 * Math.cos(center.lat * Math.PI / 180)) / Math.pow(2, map.getZoom());
  var meters = metersPerPx * targetPx;
  var km = meters / 1000;
  var niceKm = [0.05,0.1,0.2,0.5,1,2,5,10,20,50,100,200,500,1000];
  var chosen = niceKm[0];
  for (var i = 0; i < niceKm.length; i++) {
    if (niceKm[i] <= km) chosen = niceKm[i]; else break;
  }
  var niceMeters = chosen * 1000;
  var label = chosen >= 1 ? chosen + ' km' : niceMeters + ' m';
  var barPx = niceMeters / metersPerPx;
  var scaleBar  = document.getElementById('scaleBar');
  var scaleText = document.getElementById('scaleText');
  if (scaleBar && scaleText) {
    scaleBar.style.width  = Math.round(barPx) + 'px';
    scaleText.textContent = label;
  }
}
map.on('moveend zoomend', updateScalebar);
map.whenReady(function() { setTimeout(updateScalebar, 300); });

var BASE_W  = isMobile ? 10 : 5;
var HOVER_W = isMobile ? 16 : 9;

var clintonOn    = true;
var leeOn        = false;

var geoCache  = { whole: null, segment: null };

var leeLayer     = null;

// ─────────────────────────────────────────────
//  HELPERS
// ─────────────────────────────────────────────
function getIRIColor(cls) {
  return { Excellent:'#2E7D32', Good:'#8BC34A', Fair:'#FFFF00', Acceptable:'#FF9800', Bad:'#D32F2F' }[cls] || '#888';
}
function getRoadColor(type) {
  return { Primary:'#FF00FF', Secondary:'#00FFFF' }[type] || '#aaa';
}
function safe(v) { return (v===null||v===undefined||v==='') ? 'N/A' : v; }

// ─────────────────────────────────────────────
//  LOADING TOAST
// ─────────────────────────────────────────────
var loadingToast = document.getElementById('loadingToast');
var loadingMsg   = document.getElementById('loadingMsg');
var spinnerEl    = document.getElementById('spinnerEl');
function showLoading(msg, isSeg) {
  loadingMsg.textContent = msg || 'Loading…';
  spinnerEl.className = 'spinner' + (isSeg ? ' seg' : '');
  loadingToast.classList.add('visible');
}
function hideLoading() { loadingToast.classList.remove('visible'); }

// ─────────────────────────────────────────────
//  INFO POPUP
// ─────────────────────────────────────────────
var infoPopup = L.popup({ maxWidth: 280, minWidth: 200, autoPan: true, autoPanPadding: [20, 20] });

function showInfo(latlng, title, rows, mode, roadType) {
  var modeClass = mode === 'segment' ? 'seg' : 'whole';
  var modeLabel = mode === 'segment' ? 'Segment' : 'Whole Road';
  var html = '<div class="popup-mode '+modeClass+'">'+modeLabel+'</div>'
           + '<div class="popup-title">'+title+'</div>'
           + '<div class="popup-grid">';
  rows.forEach(function(r) {
    html += '<div class="info-key">'+r[0]+'</div><div class="info-val">';
    if (r[2]) {
      html += '<span class="iri-badge" style="background:'+getIRIColor(r[1])+'">'+r[1]+'</span>';
    } else {
      html += r[1];
    }
    html += '</div>';
  });
  html += '</div>';
  infoPopup.setLatLng(latlng).setContent(html).openOn(map);
  updateLegend(roadType);
}

function closeInfo() {
  if (map.hasLayer(infoPopup)) map.closePopup(infoPopup);
  resetLegend();
}

// ─────────────────────────────────────────────
//  IRI STYLE + INTERACTION
// ─────────────────────────────────────────────
function iriStyle(f) {
  var p = f.properties;
  var iri = p.iri_in_mi != null ? p.iri_in_mi : p.whole_iri_in_mi;
  var color = (iri != null)
    ? getIRIColor(classifyIRI(+iri, p.road_type))
    : (p.color_hex || getIRIColor(p.iri_class));
  return { color: color, weight: BASE_W, opacity: 0.9 };
}

function bindIRI(feature, layer, getParent, mode) {
  var p = feature.properties;
  layer.on({
    mouseover: function(e) { e.target.setStyle({ weight: HOVER_W }); },
    mouseout:  function(e) { var par=getParent(); if(par) par.resetStyle(e.target); },
    click: function(e) {
      L.DomEvent.stopPropagation(e);
      var par = getParent(); if(par) par.resetStyle(layer);
      layer.setStyle({ weight: HOVER_W, opacity: 1 });

      var spd = 'N/A';
      if (p.speed_mph!=null && p.speed_kmph!=null)
        spd = (+p.speed_mph).toFixed(1)+' mph / '+(+p.speed_kmph).toFixed(1)+' km/h';
      else if (p.speed!=null)
        spd = (Math.round(p.speed*0.621371*10)/10)+' mph / '+p.speed+' km/h';

      var iriVal   = mode==='segment' ? p.iri_in_mi : p.whole_iri_in_mi;
      var iriClass = (iriVal != null) ? classifyIRI(+iriVal, p.road_type) : safe(p.iri_class);

      var rows = mode==='segment' ? [
        ['IRI Class',   iriClass,                         true],
        ['Seg IRI',     safe(p.iri_in_mi)+' in/mi',       false],
        ['Whole IRI',   safe(p.whole_iri_in_mi)+' in/mi', false],
        ['Seg Length',  safe(p.seg_len_mi)+' mi',          false],
        ['Road Length', safe(p.whole_len_mi)+' mi',        false],
        ['Speed',       spd,                               false],
        ['Direction',   safe(p.direction),                 false],
        ['Surface',     safe(p.surface),                   false],
        ['Collection Date', safe(p.collect_dt),            false]
      ] : [
        ['IRI Class',   iriClass,                         true],
        ['Road IRI',    safe(p.whole_iri_in_mi)+' in/mi', false],
        ['Road Length', safe(p.whole_len_mi)+' mi',        false],
        ['Speed',       spd,                               false],
        ['Direction',   safe(p.direction),                 false],
        ['Surface',     safe(p.surface),                   false],
        ['Road Type',   safe(p.road_type),                 false],
        ['Segments',    safe(p.n_segments),                false],
        ['Collection Date', safe(p.collect_dt),            false]
      ];
      showInfo(e.latlng, safe(p.road_id)+(p.road_type?' · '+p.road_type:''), rows, mode, p.road_type);
    }
  });
}

// ─────────────────────────────────────────────
//  BUILD FILTERED IRI LAYER
// ─────────────────────────────────────────────
function buildFilteredLayer(data, mode) {
  var count = 0;
  var lyr = L.geoJSON(data, {
    filter: function(f) {
      var pass = featureInDateRange(f);
      if (pass) count++;
      return pass;
    },
    style: iriStyle,
    onEachFeature: function(f,l) { bindIRI(f, l, function(){ return iriLayer[mode]; }, mode); }
  });
  updateCountBadge(count, data.features ? data.features.length : 0);
  return lyr;
}

function updateCountBadge(shown, total) {
  var el = document.getElementById('countBadge');
  if (!el) return;
  if (shown === total) {
    el.textContent = total + ' roads';
  } else {
    el.textContent = shown + ' / ' + total + ' roads shown';
  }
}

// ─────────────────────────────────────────────
//  FETCH IRI (cached per source)
// ─────────────────────────────────────────────
function fetchIRI(mode, cb) {
  if (geoCache[mode]) { cb(geoCache[mode]); return; }
  var isSeg = mode==='segment';
  showLoading('Loading '+(isSeg?'segment':'whole road')+' data…', isSeg);
  fetch(URLS[mode])
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data){ geoCache[mode]=data; hideLoading(); cb(data); })
    .catch(function(e){ hideLoading(); console.error('IRI fetch ('+mode+'):', e); });
}

// ─────────────────────────────────────────────
//  CLINTON
// ─────────────────────────────────────────────
function fetchClinton(cb) {
  if (clintonLayer) { cb(); return; }
  showLoading('Loading Clinton County roads…', false);
  fetch(URLS.clinton)
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(data){
      hideLoading();
      clintonLayer = L.geoJSON(data, {
        style: function(f) {
          return { color: getRoadColor(f.properties.Road), weight: isMobile?6:3, opacity: 0.9 };
        },
        onEachFeature: function(feature, layer) {
          var p = feature.properties;
          layer.on({
            mouseover: function(e) { e.target.setStyle({ weight: isMobile?12:6 }); },
            mouseout:  function(e) { if(clintonLayer) clintonLayer.resetStyle(e.target); },
            click: function(e) {
              L.DomEvent.stopPropagation(e);
              layer.setStyle({ weight: isMobile?12:6 });
              setTimeout(function(){ if(clintonLayer) clintonLayer.resetStyle(layer); }, 800);
              showInfo(
                e.latlng,
                safe(p.FULL_NAME||p.Name||'Clinton County Road'),
                [['Class', safe(p.Road), false], ['Type', safe(p.ROAD_TYPE), false]],
                'whole', null
              );
            }
          });
        }
      });
      cb();
    })
    .catch(function(e){ hideLoading(); console.error('Clinton fetch:', e); });
}

//  LEE COUNTY
// ─────────────────────────────────────────────
function toggleLee() {
  leeOn = !leeOn;
  document.getElementById('tab-lee').classList.toggle('lee-on', leeOn);
  if (!leeOn) {
    if (leeLayer && map.hasLayer(leeLayer)) map.removeLayer(leeLayer);
    return;
  }
  if (leeLayer) {
    if (!map.hasLayer(leeLayer)) leeLayer.addTo(map);
    zoomToLee();
  } else {
    buildLeeLayer(function() { if (leeOn && !map.hasLayer(leeLayer)) { leeLayer.addTo(map); zoomToLee(); } });
  }
}

function zoomToLee() {
  if (leeLayer) {
    var b = leeLayer.getBounds();
    if (b && b.isValid()) map.fitBounds(b, { padding: [40, 40] });
  }
}

function getLeeRoadColor(system) {
  return system === 1 ? '#FF00FF' : '#00FFFF';
}

function buildLeeLayer(cb) {
  if (leeLayer) { cb(); return; }
  showLoading('Loading Lee County roads…', false);
  fetch('https://pub-256928d690cc446c84032baa7343824c.r2.dev/website/lee_county.geojson')
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(data) {
      hideLoading();
      leeLayer = L.geoJSON(data, {
        style: function(f) {
          var sys = f.properties.SYSTEM;
          return { color: getLeeRoadColor(sys), weight: isMobile ? 6 : 3, opacity: 0.9 };
        },
        onEachFeature: function(feature, layer) {
          var p = feature.properties;
          var roadTypeLabel = p.SYSTEM === 1 ? 'Primary' : 'Secondary';
          var routeLabel = p.ROUTE_ID || p.RoadName || p.Name || 'Lee County Road';
          layer.on({
            mouseover: function(e) { e.target.setStyle({ weight: isMobile ? 12 : 6 }); },
            mouseout:  function(e) { if (leeLayer) leeLayer.resetStyle(e.target); },
            click: function(e) {
              L.DomEvent.stopPropagation(e);
              layer.setStyle({ weight: isMobile ? 12 : 6 });
              setTimeout(function() { if (leeLayer) leeLayer.resetStyle(layer); }, 800);
              showInfo(
                e.latlng,
                routeLabel,
                [
                  ['Road Type', roadTypeLabel, false],
                  ['Route',     safe(p.ROUTE),       false],
                  ['IRI',       safe(p.IRI) + (p.IRI != null && p.IRI !== '' ? ' in/mi' : ''), false],
                  ['IRI Index', safe(p.IRI_INDX),   false],
                  ['Speed',     safe(p.SPEED) + (p.SPEED ? ' mph' : ''), false],
                  ['Lanes',     safe(p.LANES),       false],
                  ['Length',    safe(p.PMIS_LENGT) + (p.PMIS_LENGT != null ? ' mi' : ''), false],
                  ['Year',      safe(p.PMISYR),      false]
                ],
                'whole', null
              );
            }
          });
        }
      });
      cb();
    })
    .catch(function(e) { hideLoading(); console.error('Lee County fetch:', e); });
}

// ─────────────────────────────────────────────
var isDrawing = false;
var drawPoints = [];
var tempPolyline = null;
var finalPolygon = null;
var drawPolyBtn = document.getElementById('drawPolyBtn');

function togglePolyDraw() {
  if (isDrawing) {
    cancelPolyDraw();
  } else {
    startPolyDraw();
  }
}

function startPolyDraw() {
  isDrawing = true;
  drawPoints = [];
  drawPolyBtn.classList.add('active');
  drawPolyBtn.innerHTML = 'Cancel Draw';
  
  if (finalPolygon) { map.removeLayer(finalPolygon); finalPolygon = null; }
  
  showGPSStatus('🖱️ Click map to draw polygon. Double-click to finish.');
  
  map.on('click', onMapDrawClick);
  map.on('mousemove', onMapDrawMove);
}

function cancelPolyDraw() {
  isDrawing = false;
  drawPolyBtn.classList.remove('active');
  drawPolyBtn.innerHTML = 'Filter Area';
  hideGPSStatus();
  
  if (tempPolyline) { map.removeLayer(tempPolyline); tempPolyline = null; }
  if (finalPolygon) { map.removeLayer(finalPolygon); finalPolygon = null; }
  
  map.off('click', onMapDrawClick);
  map.off('mousemove', onMapDrawMove);
}

function onMapDrawClick(e) {
  var latlng = e.latlng;
  drawPoints.push([latlng.lat, latlng.lng]);
  
  if (!tempPolyline) {
    tempPolyline = L.polyline(drawPoints, {color: 'var(--accent2)', weight: 3, dashArray: '5, 5'}).addTo(map);
  } else {
    tempPolyline.setLatLngs(drawPoints);
  }
  
  // Detect double click manual finish condition proxy via identical structural point coordinates
  if (drawPoints.length > 2) {
    var p1 = drawPoints[drawPoints.length - 1];
    var p2 = drawPoints[drawPoints.length - 2];
    if (Math.abs(p1[0] - p2[0]) < 0.00001 && Math.abs(p1[1] - p2[1]) < 0.00001) {
      drawPoints.pop(); // pull dummy duplicate
      finishPolyDraw();
    }
  }
}

function onMapDrawMove(e) {
  if (drawPoints.length === 0 || !tempPolyline) return;
  var currentPoints = drawPoints.concat([[e.latlng.lat, e.latlng.lng]]);
  tempPolyline.setLatLngs(currentPoints);
}

// Attach explicit double click callback execution fallback hook directly to Leaflet layer mechanics
map.on('dblclick', function(e) {
  if (isDrawing && drawPoints.length > 2) {
    L.DomEvent.stopPropagation(e);
    finishPolyDraw();
  }
});

function finishPolyDraw() {
  isDrawing = false;
  drawPolyBtn.classList.remove('active');
  drawPolyBtn.innerHTML = 'Clear Selection';
  drawPolyBtn.onclick = clearPolyFilter;
  
  map.off('click', onMapDrawClick);
  map.off('mousemove', onMapDrawMove);
  if (tempPolyline) { map.removeLayer(tempPolyline); tempPolyline = null; }
  
  if (drawPoints.length < 3) {
    showGPSStatus('⚠️ Not enough points drawn.', 3000);
    clearPolyFilter();
    return;
  }
  
  finalPolygon = L.polygon(drawPoints, {color: 'var(--accent2)', fillColor: 'var(--accent2)', fillOpacity: 0.15, weight: 3}).addTo(map);
  calculateAreaMetrics();
}

function clearPolyFilter() {
  if (finalPolygon) { map.removeLayer(finalPolygon); finalPolygon = null; }
  hideGPSStatus();
  drawPolyBtn.innerHTML = 'Filter Area';
  drawPolyBtn.onclick = togglePolyDraw;
  closeInfo();
}

// Ray-casting point-in-polygon helper
function isPointInPolygon(point, vs) {
  var x = point[0], y = point[1];
  var inside = false;
  for (var i = 0, j = vs.length - 1; i < vs.length; j = i++) {
    var xi = vs[i][0], yi = vs[i][1];
    var xj = vs[j][0], yj = vs[j][1];
    var intersect = ((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function normalizeRoadType(rt) {

  rt = (rt || '').toLowerCase();

  if (
      rt.includes('interstate') ||
      rt.includes('highway') ||
      rt.includes('state')
  ) return 'Highway';

  if (rt.includes('county'))
      return 'County Road';

  if (
      rt.includes('city') ||
      rt.includes('street') ||
      rt.includes('municipal')
  ) return 'City Street';

  return 'Other';
}

function calculateAreaMetrics() {

  var activeData = geoCache[currentMode];

  if (!activeData || !activeData.features) {
    showGPSStatus('No active layer lines to sample.', 3000);
    return;
  }

  var stats = {};

  activeData.features.forEach(function(f) {

    if (!featureInDateRange(f)) return;

    if (!f.geometry || !f.geometry.coordinates) return;

    var coords = f.geometry.coordinates;
    var samplePoint = null;

    if (f.geometry.type === 'LineString') {

      var midIdx = Math.floor(coords.length / 2);

      samplePoint = [
        coords[midIdx][1],
        coords[midIdx][0]
      ];

    } else if (f.geometry.type === 'MultiLineString') {

      var midLine = coords[Math.floor(coords.length / 2)];

      samplePoint = [
        midLine[Math.floor(midLine.length / 2)][1],
        midLine[Math.floor(midLine.length / 2)][0]
      ];
    }

    if (
      samplePoint &&
      isPointInPolygon(samplePoint, drawPoints)
    ) {

      var p = f.properties;

      var iriVal =
        currentMode === 'segment'
          ? p.iri_in_mi
          : p.whole_iri_in_mi;

      var lenVal =
        currentMode === 'segment'
          ? p.seg_len_mi
          : p.whole_len_mi;

      var roadType = normalizeRoadType(p.road_type);

      if (!stats[roadType]) {

        stats[roadType] = {
          length: 0,
          iriLengthSum: 0,
          featureCount: 0
        };
      }

      if (
        lenVal != null &&
        !isNaN(lenVal)
      ) {

        stats[roadType].length += (+lenVal);
      }

      if (
        iriVal != null &&
        !isNaN(iriVal) &&
        lenVal != null &&
        !isNaN(lenVal)
      ) {

        stats[roadType].iriLengthSum +=
          (+iriVal) * (+lenVal);

        stats[roadType].featureCount++;
      }
    }
  });

  if (Object.keys(stats).length === 0) {

    showGPSStatus(
      '📊 No matching road lines inside selected polygon.'
    );

    return;
  }

  var rows = [];

  var displayOrder = [
    'Highway',
    'County Road',
    'City Street',
    'Other'
  ];

  displayOrder.forEach(function(type) {

    if (!stats[type]) return;

    var length = stats[type].length;

    var avgIRI =
      length > 0
        ? stats[type].iriLengthSum / length
        : null;

    rows.push([
      type + ' Length',
      length.toFixed(2) + ' mi',
      false
    ]);

    rows.push([
      type + ' Avg IRI',
      avgIRI
        ? avgIRI.toFixed(1) + ' in/mi'
        : 'N/A',
      false
    ]);

    rows.push([
      type + ' Roads',
      stats[type].featureCount,
      false
    ]);
  });

  var bounds = finalPolygon.getBounds();

  showInfo(
    bounds.getCenter(),
    'Selected Area Summary',
    rows,
    currentMode,
    null
  );
}

// ─────────────────────────────────────────────
//  RENDER MAP
// ─────────────────────────────────────────────
function renderMap(fitView) {
  var mode = currentMode;

  // Remove current IRI layers from both modes
  ['whole','segment'].forEach(function(m) {
    if (iriLayer[m] && map.hasLayer(iriLayer[m])) map.removeLayer(iriLayer[m]);
  });

  function applyLayers(data) {
    // Remove old layer for this mode
    if (iriLayer[mode] && map.hasLayer(iriLayer[mode])) map.removeLayer(iriLayer[mode]);
    iriLayer[mode] = buildFilteredLayer(data, mode);
    iriLayer[mode].addTo(map);
    if (fitView) {
      var b = iriLayer[mode].getBounds();
      if (b && b.isValid()) map.fitBounds(b, { padding:[50,50] });
    }
    if (clintonOn && clintonLayer && !map.hasLayer(clintonLayer)) clintonLayer.addTo(map);
    if (leeOn && leeLayer && !map.hasLayer(leeLayer)) leeLayer.addTo(map);
  }

  if (!geoCache[mode]) {
    fetchIRI(mode, function(data) { applyLayers(data); });
  } else {
    applyLayers(geoCache[mode]);
  }
}

// ─────────────────────────────────────────────
//  MODE TOGGLE
// ─────────────────────────────────────────────
function setMode(mode) {
  if (mode===currentMode) return;
  currentMode = mode;
  document.getElementById('modeWhole').classList.toggle('active', mode==='whole');
  document.getElementById('modeSeg').classList.toggle('active',   mode==='segment');
  renderMap(false);
  closeInfo();
}

// ─────────────────────────────────────────────
//  SOURCE TOGGLE
// ─────────────────────────────────────────────
function setSource(src) {
  if (src === currentSource) return;
  currentSource = src;
  URLS = src === 'smartbox' ? URLS_SMARTBOX : URLS_CYROID;

  ['whole','segment'].forEach(function(m) {
    if (iriLayer[m] && map.hasLayer(iriLayer[m])) map.removeLayer(iriLayer[m]);
    iriLayer[m] = null;
    geoCache[m] = null;
  });

  if (clintonOn && clintonLayer && !map.hasLayer(clintonLayer)) clintonLayer.addTo(map);
  if (leeOn && leeLayer && !map.hasLayer(leeLayer)) leeLayer.addTo(map);

  syncSourceColors();
  renderMap(false);
  closeInfo();
}

function syncSourceColors() {
  var isCyroid = currentSource === 'cyroid';
  document.getElementById('srcCyroid').classList.toggle('active',  isCyroid);
  document.getElementById('srcSmartBox').classList.toggle('active', !isCyroid);
  document.getElementById('srcSmartBox').classList.toggle('sb-pill', !isCyroid);
}

// ─────────────────────────────────────────────
//  CLINTON TOGGLE
// ─────────────────────────────────────────────
function toggleClinton() {
  clintonOn = !clintonOn;
  document.getElementById('tab-clinton').classList.toggle('clinton-on', clintonOn);
  if (!clintonOn) {
    if (clintonLayer && map.hasLayer(clintonLayer)) map.removeLayer(clintonLayer);
    return;
  }
  if (clintonLayer) {
    if (!map.hasLayer(clintonLayer)) clintonLayer.addTo(map);
  } else {
    fetchClinton(function() { if (clintonOn && !map.hasLayer(clintonLayer)) clintonLayer.addTo(map); });
  }
}

// ─────────────────────────────────────────────
//  DATE RANGE DROPDOWN
// ─────────────────────────────────────────────
var ddOpen = false;
var ddEl   = document.getElementById('dateDropdown');
var btnEl  = document.getElementById('dateRangeBtn');

function toggleDateDropdown() {
  ddOpen = !ddOpen;
  ddEl.classList.toggle('open', ddOpen);
  btnEl.classList.toggle('active', ddOpen);
  if (ddOpen) updateCountBadgeFromCache();
}

function closeDateDropdown() {
  ddOpen = false;
  ddEl.classList.remove('open');
  btnEl.classList.remove('active');
}

// Close on outside click
document.addEventListener('click', function(e) {
  if (ddOpen && !ddEl.contains(e.target) && e.target !== btnEl && !btnEl.contains(e.target)) {
    closeDateDropdown();
  }
});

function setAllPresets(active) {
  ['all','2026','2025','2024','1mo','1w'].forEach(function(id) {
    var el = document.getElementById('preset-'+id);
    if (el) el.classList.toggle('active', id === active);
  });
  activePreset = active;
}

function applyPreset(preset) {
  setAllPresets(preset);
  var now = new Date();
  dateFrom = null;
  dateTo   = null;

  if (preset === '2026') {
    dateFrom = new Date('2026-01-01');
    dateTo   = new Date('2026-12-31T23:59:59');
  } else if (preset === '2025') {
    dateFrom = new Date('2025-01-01');
    dateTo   = new Date('2025-12-31T23:59:59');
  } else if (preset === '2024') {
    dateFrom = new Date('2024-01-01');
    dateTo   = new Date('2024-12-31T23:59:59');
  } else if (preset === '1mo') {
    // Last 1 month
    dateFrom = new Date(now.getFullYear(), now.getMonth() - 1, now.getDate());
  } else if (preset === '1w') {
    // Last 1 week
    dateFrom = new Date(now.getTime() - (7 * 24 * 60 * 60 * 1000));
  }

  // Sync month inputs
  document.getElementById('fromMonth').value = dateFrom ? toMonthInput(dateFrom) : '';
  document.getElementById('toMonth').value   = dateTo   ? toMonthInput(dateTo)   : '';

  syncDateBtn();
  refilter();
}

function applyCustomRange() {
  var fromVal = document.getElementById('fromMonth').value;
  var toVal   = document.getElementById('toMonth').value;

  dateFrom = fromVal ? new Date(fromVal + '-01') : null;
  dateTo   = toVal   ? new Date(toVal   + '-01') : null;
  if (dateTo) {
    // End of the selected month
    dateTo = new Date(dateTo.getFullYear(), dateTo.getMonth()+1, 0, 23, 59, 59);
  }

  setAllPresets('custom');
  syncDateBtn();
  refilter();
  closeDateDropdown();
}

function toMonthInput(d) {
  var y = d.getFullYear();
  var m = String(d.getMonth()+1).padStart(2,'0');
  return y + '-' + m;
}

function syncDateBtn() {
  var label = 'IRI All';
  var isFiltered = !!(dateFrom || dateTo);
  if (dateFrom && dateTo) {
    var fy = dateFrom.getFullYear(), fm = dateFrom.getMonth()+1;
    var ty = dateTo.getFullYear(),   tm = dateTo.getMonth()+1;
    if (fy === ty && fm > 1 && tm < 12) {
      label = 'IRI ' + fy;
    } else {
      label = toMonthInput(dateFrom) + ' → ' + toMonthInput(dateTo);
    }
  } else if (dateFrom) {
    label = 'From ' + toMonthInput(dateFrom);
  } else if (dateTo) {
    label = 'Until ' + toMonthInput(dateTo);
  }
  document.getElementById('dateRangeBtnLabel').textContent = label;
  btnEl.classList.toggle('filtered', isFiltered);
}

function refilter() {
  // Invalidate built layers — rebuild from cached raw data
  ['whole','segment'].forEach(function(m) {
    if (iriLayer[m] && map.hasLayer(iriLayer[m])) map.removeLayer(iriLayer[m]);
    iriLayer[m] = null;
  });
  renderMap(false);
  closeInfo();
}

function updateCountBadgeFromCache() {
  var data = geoCache[currentMode];
  if (!data || !data.features) { document.getElementById('countBadge').textContent = ''; return; }
  var shown = 0;
  data.features.forEach(function(f) { if (featureInDateRange(f)) shown++; });
  updateCountBadge(shown, data.features.length);
}

// ─────────────────────────────────────────────
//  STARTUP
// ─────────────────────────────────────────────
fetchClinton(function() {
  if (clintonOn && !map.hasLayer(clintonLayer)) clintonLayer.addTo(map);
});
buildLeeLayer(function() {
  if (leeLayer) {
    var b = leeLayer.getBounds();
    if (b && b.isValid()) map.fitBounds(b, { padding: [40, 40] });
  }
});
syncSourceColors();
renderMap(false);

// ─────────────────────────────────────────────
//  GPS
// ─────────────────────────────────────────────
var gpsActive=false, gpsWatchId=null, gpsMarker=null, gpsCircle=null, gpsFollowing=false;
var gpsStatusEl = document.getElementById('gpsStatus');
var gpsBtnEl    = document.getElementById('gpsBtn');

function showGPSStatus(msg,dur){ gpsStatusEl.textContent=msg; gpsStatusEl.classList.add('visible'); if(dur) setTimeout(function(){gpsStatusEl.classList.remove('visible');},dur); }
function hideGPSStatus(){ gpsStatusEl.classList.remove('visible'); }
function toggleGPS(){ gpsActive ? stopGPS() : startGPS(); }

function startGPS(){
  if(!navigator.geolocation){ showGPSStatus('GPS not supported',3000); return; }
  gpsActive=true; gpsFollowing=true;
  gpsBtnEl.classList.add('searching');
  showGPSStatus('📡 Searching for GPS signal…');
  gpsWatchId=navigator.geolocation.watchPosition(onGPSSuccess,onGPSError,{enableHighAccuracy:true,maximumAge:5000,timeout:15000});
}
function stopGPS(){
  gpsActive=false; gpsFollowing=false;
  if(gpsWatchId!==null){navigator.geolocation.clearWatch(gpsWatchId);gpsWatchId=null;}
  if(gpsMarker){map.removeLayer(gpsMarker);gpsMarker=null;}
  if(gpsCircle){map.removeLayer(gpsCircle);gpsCircle=null;}
  gpsBtnEl.classList.remove('active','searching');
  hideGPSStatus();
}
function onGPSSuccess(pos){
  var lat=pos.coords.latitude,lng=pos.coords.longitude,acc=pos.coords.accuracy;
  gpsBtnEl.classList.remove('searching'); gpsBtnEl.classList.add('active');
  showGPSStatus('📍 Accuracy: ~'+Math.round(acc)+'m',3000);
  if(gpsCircle) map.removeLayer(gpsCircle);
  gpsCircle=L.circle([lat,lng],{radius:acc,color:'#1a6ef5',fillColor:'#1a6ef5',fillOpacity:0.08,weight:1,className:'leaflet-gps-accuracy'}).addTo(map);
  if(gpsMarker) map.removeLayer(gpsMarker);
  var icon=L.divIcon({className:'',html:'<div class="gps-dot"></div>',iconSize:[18,18],iconAnchor:[9,9]});
  gpsMarker=L.marker([lat,lng],{icon:icon,zIndexOffset:1000}).addTo(map)
    .bindPopup('<b>You are here</b><br>Accuracy: ~'+Math.round(acc)+'m<br>'+lat.toFixed(5)+', '+lng.toFixed(5));
  if(gpsFollowing){map.setView([lat,lng],Math.max(map.getZoom(),14));gpsFollowing=false;}
}
function onGPSError(err){
  gpsBtnEl.classList.remove('searching','active'); gpsActive=false;
  var msgs={1:'Location permission denied.',2:'GPS signal unavailable.',3:'GPS timed out.'};
  showGPSStatus('⚠️ '+(msgs[err.code]||'GPS error'),4000);
}
map.on('dragstart',function(){gpsFollowing=false;});
document.getElementById('gpsBtn').addEventListener('click',function(){
  if(gpsActive&&gpsMarker){gpsFollowing=true;map.setView(gpsMarker.getLatLng(),Math.max(map.getZoom(),14));}
});
</script>
